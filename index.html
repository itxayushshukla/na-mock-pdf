*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{header,#ck,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.qc{break-inside:avoid}.pfoot{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:#555;border-top:1px solid #ccc;padding:4px;background:#fff}#rv{padding-bottom:34px}}

// Answer key text -> [{n,type,answer,tol}]. Formats: 1-B  2:C  3=A,C  21-5.5  22-4±0.1  (also "1. B" / "1) B")
function parseKey(t){const out=[],err=[];
 t=String(t||'').replace(/(\d+)\s*[.)]\s*(?=[A-Da-d](?![A-Za-z0-9.]))/g,'$1-').replace(/\s*([-:=])\s*/g,'$1').replace(/\s*(±|\+-|\+\/-)\s*/g,'±');
 for(const tok of t.split(/[\s;]+/).filter(Boolean)){
  const m=tok.match(/^(\d+)[-:=](.+)$/);if(!m){err.push('Cannot read "'+tok+'"');continue}
  const n=+m[1],a=m[2];
  if(/^[A-Da-d]([,+]?[A-Da-d])*$/.test(a)){const L=[...new Set(a.toUpperCase().replace(/[^A-D]/g,'').split(''))].sort();out.push({n,type:'mcq',answer:L.join(',')})}
  else{const q=a.match(/^(-?\d+(?:\.\d+)?(?:[eE][-+]?\d+)?)(?:±(\d+(?:\.\d+)?))?$/);if(!q){err.push('Bad answer for Q'+n+': "'+a+'"');continue}out.push({n,type:'num',answer:q[1],tol:q[2]?+q[2]:0})}}
 const seen={};out.forEach(o=>{if(seen[o.n])err.push('Q'+o.n+' appears twice');seen[o.n]=1});
 out.sort((x,y)=>x.n-y.n);return{items:out,errors:err}}

 if(ex.paper_path)drawPaper();else draw();timer=setInterval(()=>{const left=exp-Date.now();if(left<=0){fin(false);return}const e=$('#tm');if(e)e.textContent=Math.floor(left/60000)+':'+String(Math.floor(left/1000)%60).padStart(2,'0')},1000)}
async function review(attId,title){
 const d=await Q(sb.rpc('get_attempt_review',{p_attempt_id:attId})),r=d.result,bd=r&&r.subject_breakdown||{};
 const fx=v=>v==null?'-':(v>0?'+'+v:v);
 const qh=d.questions.map(q=>{const num=q.type=='numerical',sel=q.selected||[],cor=q.correct||[];
  const nopt=!num&&!(q.options||[]).length,body=nopt?`<div class="ro ${q.is_correct?'ok':sel.length?'no':''}">Your answer: <b>${sel.length?esc(sel.join(', ')):'Not attempted'}</b></div><div class="ro ok">Correct answer: <b>${esc(cor.join(', '))}</b></div>`:num?`<div class="ro ${q.is_correct?'ok':q.num_answer==null?'':'no'}">Your answer: <b>${q.num_answer==null?'Not attempted':esc(q.num_answer)}</b></div><div class="ro ok">Correct answer: <b>${esc(q.correct_num)}</b></div>`
   :(q.options||[]).map(o=>{const c=cor.includes(o.key),m=sel.includes(o.key);return`<div class="ro ${c?'ok':m?'no':''}">${esc(o.key)}. ${esc(o.text)}${c?' &nbsp;✔ correct':''}${m?(c?' &nbsp;(your answer)':' &nbsp;✘ your answer'):''}</div>`}).join('')+(sel.length?'':'<div class="muted">Not attempted</div>');
  return`<div class="qc"><div class="muted"><b>Q${q.n}</b> · ${esc(q.subject)} · ${num?'Numerical':'MCQ'} · Marks: <b>${fx(q.awarded)}</b></div><div style="white-space:pre-wrap;margin:6px 0">${esc(q.text)}</div>${q.image?`<img src="${esc(q.image)}" alt="" style="max-width:100%">`:''}${body}${q.explanation?`<div class="muted" style="margin-top:6px;white-space:pre-wrap"><b>Solution:</b> ${esc(q.explanation)}</div>`:''}</div>`}).join('');
 $('#app').innerHTML=`<div class="noprint" style="margin-bottom:14px"><button class="g" id="bk">← Back</button> <button id="pr">Download PDF</button> <span class="muted">In the window that opens, choose “Save as PDF” as the printer.</span></div>
 <div id="rv"><div class="phd"><img src="logo.png" alt=""><div><div style="font-size:24px;font-weight:800;color:var(--b)">National Academy</div><div class="muted">JEE · NEET · MHT-CET · Kalyan East, Maharashtra</div></div></div>
 <h2>${esc(d.exam.title)} — Answer Key &amp; Solutions</h2>
 <p><b>${esc(me.name)}</b>${r?` · Score <b>${r.score} / ${r.total_marks}</b> · Correct ${r.correct_count} · Wrong ${r.incorrect_count} · Skipped ${r.unattempted_count}`:''}</p>
 ${Object.keys(bd).length?`<table><tr><th>Subject</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th></tr>${Object.entries(bd).map(([k,v])=>`<tr><td>${esc(k)}</td><td><b>${v.score}</b></td><td>${v.correct}</td><td>${v.incorrect}</td><td>${v.unattempted}</td></tr>`).join('')}</table>`:''}
 <div style="margin-top:12px">${qh}</div></div><div class="pfoot">National Academy · Practice Like the Real Exam · ${esc(d.exam.title)}</div>`;
 $('#bk').onclick=stu;
 $('#pr').onclick=()=>{const t=document.title;document.title='National Academy - '+title+' - '+me.name+' - Answer Key';window.print();setTimeout(()=>document.title=t,1500)}}
window.addEventListener('beforeunload',e=>{if(timer&&me&&me.role=='student'){e.preventDefault();e.returnValue=''}});
boot();
</script></body></html>
